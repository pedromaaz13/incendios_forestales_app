name: publicar

# Publica el visor con datos reales en GitHub Pages.
#
# Es la ruta corta a producción: solo necesita `FIRMS_MAP_KEY`. Cloudflare R2 y
# el workflow `ingest` son para más adelante, cuando el histórico crezca lo
# suficiente como para no caber en el repositorio.
#
# Limitación consciente: Pages sirve ficheros estáticos y no guarda estado entre
# ejecuciones, así que el histórico en Parquet **no se acumula** por esta vía.
# Para eso hace falta el bucket. Aquí lo que importa es ver el mapa funcionando.

on:
  schedule:
    # Cada 30 min. Más a menudo no aporta: FIRMS NRT tiene ~3 h de latencia y
    # los minutos de Actions no son infinitos.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: |
          pip install -q -r requirements.txt
          cd web && npm ci

      # RF-P-07 · la capa municipal pone nombre a cada incendio. Sin ella el
      # visor publica "Ubicación por determinar" en todos, que es correcto pero
      # inútil. Se cachea porque son decenas de MB y el cron corre cada 30 min.
      - name: Restaurar capa municipal
        id: cache_municipios
        uses: actions/cache@v4
        with:
          path: config/municipios.geojson
          key: municipios-v1

      # `continue-on-error`: sin nombres de municipio el pipeline funciona
      # igual. Bloquear la publicación de 79 incendios porque no responde un
      # servicio de cartografía sería desproporcionado.
      - name: Preparar capa municipal
        if: steps.cache_municipios.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/preparar_municipios.py --candidatas

      - name: Estado de la capa municipal
        if: always()
        run: |
          if [ -f config/municipios.geojson ]; then
            echo "✅ Capa municipal disponible ($(du -h config/municipios.geojson | cut -f1))"
          else
            echo "::warning::Sin capa municipal: los incidentes saldrán sin nombre de municipio."
            {
              echo "### ℹ️ Sin capa municipal"
              echo
              echo "Los incendios se publican sin nombre de municipio. No es un fallo:"
              echo "la capa del IGN no está disponible por descarga directa."
              echo
              echo "Para añadirla: descárgala del Centro de Descargas del CNIG"
              echo "(serie *Líneas límite municipales*) y ejecuta"
              echo '`python scripts/preparar_municipios.py --fichero descarga.gpkg`,'
              echo "luego commitea \`config/municipios.geojson\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Si la clave falta o está agotada, se publica la demo en lugar de un
      # mapa vacío. Un visor que dice "0 incendios" cuando lo que pasa es que no
      # hay clave es exactamente el fallo que este proyecto evita.
      - name: Ejecutar pipeline
        id: pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          PYTHONPATH: src
        run: |
          # Caer a la demo sin decir por qué convierte un problema de
          # configuración en un misterio. Cada rama deja su motivo en el
          # resumen del job.
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::error::FIRMS_MAP_KEY no llega al workflow. Comprueba que el"
            echo "::error::secreto existe en Settings > Secrets and variables >"
            echo "::error::Actions (pestaña 'Secrets', no 'Variables') y que se"
            echo "::error::llama exactamente FIRMS_MAP_KEY."
            echo "motivo=La clave FIRMS_MAP_KEY no está configurada" >> "$GITHUB_OUTPUT"
            python scripts/build_demo_data.py
            echo "modo=demo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "FIRMS_MAP_KEY presente (${#FIRMS_MAP_KEY} caracteres)."

          # Comprueba la clave antes de correr el pipeline entero: FIRMS
          # responde 200 con texto plano cuando está agotada o es inválida, y
          # sin esta comprobación el fallo aparecería como "cero incendios".
          if ! python scripts/descubrir_fuentes.py --firms | tee /tmp/firms.txt; then
            echo "::error::La clave de FIRMS no es válida o está agotada."
            cat /tmp/firms.txt
            echo "motivo=La clave de FIRMS no funciona: $(head -c 200 /tmp/firms.txt)" >> "$GITHUB_OUTPUT"
            python scripts/build_demo_data.py
            echo "modo=demo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if python -m incendios.pipeline -v --no-raw 2>&1 | tee /tmp/pipeline.txt; then
            mkdir -p web/public/live
            cp data/out/*.geojson data/out/*.json web/public/live/
            echo "modo=real" >> "$GITHUB_OUTPUT"
          else
            echo "::error::El pipeline abortó. Últimas líneas:"
            tail -30 /tmp/pipeline.txt
            echo "motivo=El pipeline abortó: $(tail -3 /tmp/pipeline.txt | head -c 200)" >> "$GITHUB_OUTPUT"
            python scripts/build_demo_data.py
            echo "modo=demo" >> "$GITHUB_OUTPUT"
          fi

      # Comprueba que lo que se va a publicar cuadra con lo que trajo la fuente:
      # recuentos, invariantes, coordenadas y —sobre todo— que la antigüedad
      # publicada sea la real.
      - name: Verificar coherencia de los datos
        if: steps.pipeline.outputs.modo == 'real'
        env:
          PYTHONPATH: src
        run: |
          python scripts/verificar_datos.py | tee /tmp/informe.txt
          {
            echo "## Verificación de datos"
            echo
            python scripts/verificar_datos.py --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar el visor
        working-directory: web
        env:
          # Pages sirve bajo /nombre-del-repo/, no bajo la raíz.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      # Si Pages no está activado, este paso falla con un mensaje que no dice
      # qué hacer. `continue-on-error` permite explicarlo abajo.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Pages sin activar
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages no está activado en este repositorio."
          {
            echo "## ⚠️ Falta activar GitHub Pages"
            echo
            echo "Todo lo demás ha funcionado: el pipeline corrió y el visor compiló."
            echo "Solo falta un ajuste que no puede hacerse desde el workflow:"
            echo
            echo "**Settings → Pages → Source → GitHub Actions**"
            echo
            echo "Después, vuelve a lanzar este workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Publicación"
            echo
            echo "- Modo: **${{ steps.pipeline.outputs.modo }}**"
            if [ -n "${{ steps.pipeline.outputs.motivo }}" ]; then
              echo "- Motivo de no usar datos reales: ${{ steps.pipeline.outputs.motivo }}"
            fi
            echo "- URL: ${{ steps.despliegue.outputs.page_url }}"
            if [ -f data/out/manifest.json ]; then
              echo
              echo '<details><summary>manifest.json</summary>'
              echo
              echo '```json'
              cat data/out/manifest.json
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
