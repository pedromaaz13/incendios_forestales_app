[tool.ruff]
# Sin esta sección cada versión de ruff aplica su propio conjunto de reglas por
# defecto, y CI —que instala la última— empieza a fallar de un día para otro sin
# que nadie haya tocado el código. El lint tiene que ser reproducible.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # orden de imports
    "UP",   # modernización de sintaxis
    "B",    # bugbear: fallos reales, no estilo
    "SIM",  # simplificaciones
    "RUF",  # reglas propias de ruff
]
ignore = [
    "E501",    # longitud de línea: la controla el formateador
    # Los `except Exception` de este repo son deliberados y están documentados:
    # aislar el fallo de una fuente para que no tumbe el pipeline es un
    # requisito explícito (RF-P-03), no un descuido.
    "BLE001",
    # `dict(...)` se usa a propósito en las tablas de datos de demostración,
    # donde la forma de llamada se lee mejor que las llaves.
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# Los tests usan lambdas de un solo uso como manejadores de httpx: convertirlas
# en `def` con nombre alarga sin aclarar nada.
"tests/*" = ["E731"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `src` para el paquete y `tests` para poder importar las fábricas de conftest
# desde los ficheros de prueba sin convertir tests/ en un paquete instalable.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:incendios.*",
]

[tool.coverage.run]
source = ["incendios"]
branch = true
# pipeline.py es el `main`: argparse y logging. Se ejercita en la prueba de humo
# y en el propio cron, no aporta nada medirlo aquí.
omit = ["*/incendios/pipeline.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# RNF-10. Vive aquí y no en addopts para que aplique igual desde CI que en local.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
